{% extends "store/base.html" %}

{% block title %}My Wishlist{% endblock %}

{% block content %}
    <h1>My Wishlist</h1>
    <div class="row">
        {% for item in wishlist_items %}
            <div class="col-md-4">
                <div class="card mb-4 shadow-sm">
                    <a href="{{ item.product.get_absolute_url }}">
                        <img src="https://via.placeholder.com/300x400?text={{item.product.name}}" class="card-img-top" alt="{{ item.product.name }}">
                    </a>
                    <div class="card-body">
                        <h5 class="card-title"><a href="{{ item.product.get_absolute_url }}" class="text-decoration-none text-dark">{{ item.product.name }}</a></h5>
                        <p class="card-text">${{ item.product.price }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{% url 'cart:cart_add' item.product.id %}" class="btn btn-sm btn-outline-secondary">Add to Cart</a>
                            <a href="{% url 'users:remove_from_wishlist' item.product.id %}" class="btn btn-sm btn-outline-danger">Remove</a>
                        </div>
                    </div>
                </div>
            </div>
        {% empty %}
            <p>Your wishlist is empty.</p>
        {% endfor %}
    </div>
{% endblock %}
