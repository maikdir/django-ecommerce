{% extends "admin/base_site.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<h1>Store Dashboard</h1>
<div class="row">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h2>Total Products</h2>
            </div>
            <div class="card-body">
                <p class="h1">{{ total_products }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h2>Total Orders</h2>
            </div>
            <div class="card-body">
                <p class="h1">{{ total_orders }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h2>Total Revenue</h2>
            </div>
            <div class="card-body">
                <p class="h1">${{ total_revenue|floatformat:2 }}</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
